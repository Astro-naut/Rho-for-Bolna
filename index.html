function payments(){let filtered=transactions.filter(t=>filter==='All'||t.type===filter||filter==='Received'&&t.amount.startsWith('+'));return `<section class="content"><div class="heading-row"><div><div class="eyebrow">Money in motion</div><h1 class="h1">Payments</h1><p class="sub">Send, receive and keep track of every rupee.</p></div><button class="button" onclick="openModal('payment')">＋ &nbsp;New payment</button></div><div class="feature-card"><div><div class="eyebrow">UPI is ready</div><h3>Pay anyone, instantly.</h3><p>Your UPI ID · john.doe@sprout</p></div><button class="button light" onclick="openModal('payment')">Send money&nbsp; →</button></div><div class="page-block"><div class="panel-head"><h3 class="section-title">Activity</h3><input class="search" placeholder="Search activity" oninput="searchTx(this.value)"></div><div class="filters">${['All','Sent','Received','Bills','Spent'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="panel list-panel" style="margin-top:14px" id="txlist">${filtered.map(t=>txRow(t)).join('')}</div></div></section>`}

<script>
(function(){
  try {
    var params = new URLSearchParams(location.search);
    var rhoQ = params.get('rho');
    if (rhoQ) {
      localStorage.setItem('rho_api', String(rhoQ).replace(/\/$/, ''));
    }
    if (params.get('fresh') === '1') {
      var keepRho = rhoQ ? String(rhoQ).replace(/\/$/, '') : localStorage.getItem('rho_api');
      try { localStorage.clear(); } catch (e) {}
      if (keepRho) {
        try { localStorage.setItem('rho_api', keepRho); } catch (e) {}
      }
      var finish = function(){
        params.delete('fresh');
        var q = params.toString();
        location.replace(location.pathname + (q ? '?' + q : '') + location.hash);
      };
      var clearCaches = (typeof caches !== 'undefined')
        ? caches.keys().then(function(keys){ return Promise.all(keys.map(function(k){ return caches.delete(k); })); })
        : Promise.resolve();
      clearCaches.then(finish).catch(finish);
      return;
    }
    var stored = null;
    try { stored = localStorage.getItem('rho_api'); } catch (e) {}
    window.RHO_API = stored || window.RHO_API || 'https://rho-for-bolna.vercel.app';
  } catch (e) {
    window.RHO_API = window.RHO_API || 'https://rho-for-bolna.vercel.app';
  }
})();
</script>
